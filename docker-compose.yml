services:

  java-api:
    build:
      context: ./java-api
    container_name: matrix-java-api
    ports:
      - "8081:8080"
    networks:
      - matrix-network

  dotnet-api:
    build:
      context: ./dotnet-api
    container_name: matrix-dotnet-api
    ports:
      - "8080:8080"
    environment:
      JavaApi__BaseUrl: http://java-api:8080
      ConnectionStrings__Default: Data Source=/data/matrixqr.db
    volumes:
      - dotnet-data:/data
    depends_on:
      - java-api
    networks:
      - matrix-network

networks:
  matrix-network:

volumes:
  dotnet-data: